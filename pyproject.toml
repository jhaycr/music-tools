[project]
name = "music-tools"
version = "0.3.3"
description = "Small one-shot tools for a self-hosted music library: follow favourite Deezer artists, keep deemix logged in"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
music-tools = "music_tools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["music_tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
