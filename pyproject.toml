[project]
name = "music-tools"
version = "0.6.0"
description = "Small tools for a self-hosted music library: follow favourite Deezer artists, keep deemix logged in, link albums between categories, with a web UI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
music-tools = "music_tools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["music_tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
